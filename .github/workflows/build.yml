name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Cordova Android Project
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          npx -y cordova@12 create game-app com.nightmare.forgottenhouse "Nightmare"
          cd game-app
          npx -y cordova@12 platform add android@13
          rm -rf www/*

      - name: Copy Game HTML & Prepare App Icon
        run: |
          HTML_FILE=$(find . -maxdepth 1 -type f -iname "*.html" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" game-app/www/index.html
          else
            echo "No HTML file found!" && exit 1
          fi

          mkdir -p game-app/res
          for f in *; do
            if [ -f "$f" ]; then
              MIME=$(file --mime-type -b "$f")
              if [[ "$MIME" == image/* ]]; then
                ffmpeg -y -i "$f" -vf "scale=512:512" game-app/res/icon.png > /dev/null 2>&1 || cp "$f" game-app/res/icon.png
                break
              fi
            fi
          done

      - name: Configure config.xml
        run: |
          cd game-app
          if [ -f "res/icon.png" ]; then
            sed -i '/<\/widget>/i <icon src="res\/icon.png" />' config.xml
          fi
          sed -i '/<\/widget>/i <preference name="Orientation" value="landscape" />' config.xml
          sed -i '/<\/widget>/i <preference name="Fullscreen" value="true" />' config.xml

      - name: Build Debug APK
        run: |
          cd game-app
          npx -y cordova@12 build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nightmare-APK
          path: game-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
